<style>

:root{

  --ok:#2b8a3e; --ok-soft:#dcf3e1; --bad:#d6336c; --bad-soft:#fde3ec;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ok:#69db7c; --ok-soft:#1d3524; --bad:#ff8fb1; --bad-soft:#3d1f2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --surface:#1b2130; --fg:#e8ecf5; --muted:#9aa3b6; --border:#2c3446;
  --accent:#8c9bff; --accent-soft:#252c4d; --paper:#3d3820; --paper-ink:#fbefb5; --paper-edge:#5a5228;
  --ok:#69db7c; --ok-soft:#1d3524; --bad:#ff8fb1; --bad-soft:#3d1f2a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(26px,5vw,36px);margin:0;line-height:1.1;font-weight:700;letter-spacing:-.01em}
h1 span{font-family:var(--hand);font-weight:700;color:var(--accent);margin-left:.25em}
.sub{margin:4px 0 0;color:var(--muted);max-width:60ch}
.clock{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 6px 6px 16px}
.time{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.time.low{color:var(--bad)}
.btn{background:var(--accent);color:#fff;border-radius:999px;padding:9px 18px;font-weight:500}
.btn.sm{padding:6px 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--border)}
.btn:disabled{opacity:.5;cursor:default}

.path{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:4px 2px}
.path .stop{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--kr);font-weight:700;font-size:16px;background:var(--surface);border:2px solid var(--border);color:var(--muted)}
.path .stop.done{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.path .stop.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);color:var(--accent)}
.path .seg{flex:1 0 8px;height:3px;background:var(--border);border-radius:2px;min-width:8px}
.path .seg.done{background:var(--ok)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}

.card h2{font-size:24px;margin:2px 0 0;line-height:1.2;text-wrap:balance}
.story{margin:0;max-width:65ch}
.task{margin:0;font-weight:500;background:var(--accent-soft);border-radius:10px;padding:10px 14px}

.note p{margin:0}

.note.msg{transform:none;border-radius:18px 18px 18px 4px;font-family:var(--kr);font-size:19px;background:var(--accent-soft);color:var(--fg);border-bottom:none;box-shadow:none}

.qs{display:flex;flex-direction:column;gap:12px}
.qrow{display:flex;flex-direction:column;gap:6px}
.qrow .qt{font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--border);background:var(--bg);border-radius:10px;padding:7px 12px;text-align:left;min-width:0}
.chip .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.kr{font-family:var(--kr);font-weight:700}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.item{border:2px solid var(--border);background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left}
.item .em{font-size:30px;line-height:1}
.item .price{font-variant-numeric:tabular-nums;font-weight:700}
.item .d{color:var(--muted);font-size:14px}

.item .num{font-weight:700;color:var(--accent);font-size:14px}

.targets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.cell .w{font-family:var(--kr);font-weight:700;font-size:20px}
.cell .n{font-size:13px;color:var(--muted);font-weight:700}
.cell.on{border-color:var(--accent);background:var(--accent-soft)}

.lines{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}

.line .s{font-family:var(--kr);font-size:19px;flex:1;min-width:0}
.line .tag{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--bad);text-transform:uppercase;visibility:hidden}
.line.on{border-color:var(--bad);background:var(--bad-soft)}
.line.on .tag{visibility:visible}

.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:10px;border:2px dashed var(--border);border-radius:12px}
.pool:empty::after{content:"Все слова разложены";color:var(--muted)}
.word{font-family:var(--kr);font-weight:700;font-size:18px;padding:6px 12px;border-radius:10px;background:var(--paper);color:var(--paper-ink);border:2px solid transparent}
.word.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.box{border:2px solid var(--border);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--bg);min-height:110px}
.box .h{font-family:var(--kr);font-weight:700;font-size:20px}
.box .h small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.box .in{display:flex;flex-wrap:wrap;gap:6px}
.box.ready{border-color:var(--accent);border-style:dashed}

.audio{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.script{font-family:var(--kr);font-size:17px;background:var(--bg);border-radius:12px;padding:12px 14px;margin:0}
.cities{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.city{border:2px solid var(--border);border-radius:14px;padding:10px 12px;background:var(--bg)}
.city .kr{font-size:20px}
.city .d{color:var(--muted);font-size:14px}
.city .temp{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.warn{font-size:14px;color:var(--bad)}

.fill{font-family:var(--kr);font-size:20px;display:flex;flex-direction:column;gap:12px}

.tray{min-height:58px;border:2px dashed var(--border);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.tiles{display:flex;flex-wrap:wrap;gap:8px}

.tile .n{font-family:var(--body);font-size:13px;opacity:.7}
.tile.used{visibility:hidden}

.lock{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:16px}
.lock label{font-weight:700}
.lock input{font:inherit;font-size:24px;font-weight:700;letter-spacing:.3em;width:8.5em;max-width:100%;padding:6px 12px;border-radius:12px;border:2px solid var(--border);background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
.lock.shake{animation:shake .4s}

.feedback{min-height:24px;font-weight:500}
.feedback.no{color:var(--bad)} .feedback.ok{color:var(--ok)}
.hint{background:var(--bg);border-radius:12px;padding:10px 14px;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.open{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--ok-soft);border-radius:14px;padding:14px 16px}
.syl{font-family:var(--kr);font-weight:700;font-size:44px;width:76px;height:76px;border-radius:18px;display:grid;place-items:center;background:var(--ok);color:var(--surface);animation:pop .5s ease;flex:0 0 auto}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg)}70%{transform:scale(1.1)}100%{transform:none}}
.party{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.party .big{font-family:var(--kr);font-weight:700;font-size:clamp(28px,6vw,42px)}

.bag{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.bag span.s.got{border:2px solid var(--ok);background:var(--ok-soft);color:var(--fg)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--ok)}
.dict{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px}

.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:12px}
.dgrid h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.dgrid dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.dgrid dt{font-family:var(--kr);font-weight:700}
.dgrid dd{margin:0;color:var(--muted);min-width:0}
.path .stop.star{color:#c08a00;border-color:#e6b422}
.path .stop.star.done{background:#e6b422;color:#fff}
.clues{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:18px}
.clues li{font-weight:400}
.lg-wrap{overflow-x:auto;margin-top:12px}
.lg{border-collapse:collapse;font-variant-numeric:tabular-nums}
.lg th{font-size:14px;font-weight:700;padding:4px 6px;text-align:center;line-height:1.2}
.lg tbody th{text-align:left;font-size:17px;padding-right:10px}
.lg td{padding:3px}
.lc{width:44px;height:44px;border-radius:10px;border:2px solid var(--border);background:var(--bg);font-size:20px;font-weight:700}
.lc.v1{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.lc.v2{color:var(--bad);background:var(--bad-soft);border-color:var(--bad-soft)}
@media (max-width:560px){.card{padding:16px}.note{font-size:21px}.grid9{gap:6px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fresh(){return {v:5,bonusOk:false,ch:0,solved:CH.map(()=>false),m:{},input:{},hint:{},showText:false,sel:null,tray:{},finalOk:false,fb:null,timer:{running:false,endsAt:0,left:1200}}}
let S=fresh(), ref=null, writing=false, queued=false, typingTimer=null;

/* ---------- shared game ---------- */
function commit(){render();push()}
function push(){if(!ref)return;queued=true;if(!writing)pump()}
async function pump(){writing=true;
  while(queued){queued=false;try{await ref.set(JSON.parse(JSON.stringify(S)))}catch(e){setSync(false,"Ход не сохранился: у этого аккаунта нет права взаимодействовать со страницей.");break}}
  writing=false}
function setSync(on,t){$("sync").className="sync"+(on?" on":"");$("sync").querySelector("span").textContent=t}
(async()=>{
  let db=null;try{db=await claude.use("db")}catch(e){}
  if(!db){setSync(false,"Игра идёт только на этом экране");return}
  ref=db.doc("coop/state");setSync(true,"Общая игра: все, кто открыл ссылку, видят одно и то же");
  let first=true;
  ref.onSnapshot(snap=>{
    const d=snap.exists?snap.data():null;
    if(!d||d.v!==5){if(first)push()}
    else if(!snap.metadata.hasPendingWrites&&!writing){S=Object.assign(fresh(),d);render()}
    first=false},()=>setSync(false,"Связь потеряна. Обновите страницу."));
})();

/* ---------- helpers ---------- */
const M=()=>(S.m[S.ch]=S.m[S.ch]||{});
const isBonus=()=>S.ch==="bonus";
const curCh=()=>isBonus()?BONUS:CH[S.ch];
const isSolved=()=>isBonus()?S.bonusOk:S.solved[S.ch];
function toggle(k,v){const m=M();if(m[k]===v)delete m[k];else m[k]=v;S.fb=null;commit()}
function setOnly(k,v){const m=M();m[k]=v;S.fb=null;commit()}

/* ---------- render ---------- */
function render(){
  const ae=document.activeElement,keep=ae&&ae.id==="code"?[ae.selectionStart,ae.selectionEnd]:null;
  renderPath();renderBag();
  const c=$("card");
  if(isBonus())renderChapter(c,BONUS);else if(S.ch>=CH.length)renderFinal(c);else renderChapter(c,CH[S.ch]);
  if(keep&&$("code")){$("code").focus();try{$("code").setSelectionRange(keep[0],keep[1])}catch(e){}}
  const l=timeLeft();$("time").textContent=fmt(l);
  $("timerBtn").textContent=S.timer.running?"Пауза":(S.timer.left<1200?"Продолжить":"Старт");
}
function renderPath(){
  let h="";CH.forEach((ch,i)=>{
    if(i)h+=`<span class="seg${S.solved[i-1]?" done":""}"></span>`;
    h+=`<button class="stop${S.solved[i]?" done":""}${S.ch===i?" cur":""}" data-i="${i}" title="${ch.ru}" ${S.solved[i]||i===S.ch?"":"disabled"}>${S.solved[i]?ch.syl:(i+1)}</button>`});
  h+=`<span class="seg${S.solved[CH.length-1]?" done":""}"></span><button class="stop${S.finalOk?" done":""}${S.ch===CH.length?" cur":""}" data-i="${CH.length}" title="Финал" ${S.solved.every(Boolean)?"":"disabled"}>🎂</button><span class="seg"></span><button class="stop star${S.bonusOk?" done":""}${isBonus()?" cur":""}" data-i="bonus" title="Бонус: сложное задание">★</button>`;
  $("path").innerHTML=h;
  $("path").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.ch=b.dataset.i==="bonus"?"bonus":+b.dataset.i;S.fb=null;S.sel=null;commit()});
}
function renderBag(){$("bag").innerHTML=`<span class="lbl">Слоги пароля</span>`+CH.map((c,i)=>`<span class="s${S.solved[i]?" got":""}">${S.solved[i]?c.syl:"?"}</span>`).join("")}

function renderChapter(c,ch){
  const i=S.ch,m=M();
  let h=`<div><div class="place"><b>${ch.kr}</b>${isBonus()?"Задание со звёздочкой":`Глава ${i+1} из ${CH.length}`} · ${ch.ru}</div><h2>${ch.title}</h2></div><p class="story">${ch.story}</p>`;
  if(ch.note)h+=`<div class="note"><p>${ch.note}</p><p class="from">— 수아 🎈</p></div>`;
  if(ch.msg)h+=`<div class="note msg">${ch.msg}</div>`;
  h+=`<p class="task">${ch.task}</p><div id="puzzle"></div>`;
  if(isBonus()&&S.bonusOk){
    h+=`<div class="open"><div class="syl">★</div><div><b>Блестяще! Код ${ch.code}.</b><br>민수 — 📚, 지아 — 🧣, 준호 — 🍜, 하나 — 🧸. Вы настоящие детективы!</div></div>`;
  }else if(S.solved[i]){
    h+=`<div class="open"><div class="syl">${ch.syl}</div><div><b>Замок открыт! Код ${ch.code}.</b><br>Вы получили слог для пароля.</div><button class="btn" id="next" style="margin-left:auto">${i===CH.length-1?"К финалу":"Дальше"} →</button></div>`;
  }else{
    h+=`<div class="lock" id="lock"><label for="code">🔒 Код</label><input id="code" inputmode="numeric" autocomplete="off" value="${esc(S.input[i]||"")}"><button class="btn" id="try">Открыть</button>
      <button class="btn ghost sm" id="hintBtn">${S.hint[i]?"Подсказка открыта":"Подсказка"}</button></div>
      <div class="feedback ${S.fb?(S.fb.ok?"ok":"no"):""}">${S.fb?esc(S.fb.t):""}</div>`;
    if(S.hint[i])h+=`<p class="hint">💡 ${ch.hint}</p>`;
  }
  c.innerHTML=h;
  const p=$("puzzle");
  ({quiz:pQuiz,menu:pMenu,grid:pGrid,list:pList,sort:pSort,shop:pShop,audio:pAudio,fill:pFill,tiles:pTiles,logic:pLogic})[ch.kind](p,ch,m);
  if(isBonus()&&S.bonusOk)return;
  if(S.solved[i]){$("next").onclick=()=>{S.ch=i+1;S.fb=null;S.sel=null;commit()};return}
  const inp=$("code");
  inp.oninput=()=>{S.input[i]=inp.value;clearTimeout(typingTimer);typingTimer=setTimeout(push,400)};
  inp.onkeydown=e=>{if(e.key==="Enter")tryCode()};
  $("try").onclick=tryCode;
  $("hintBtn").onclick=()=>{if(!S.hint[i]){S.hint[i]=true;commit()}};
}
function tryCode(){
  const i=S.ch,ch=curCh(),val=(S.input[i]||"").replace(/\D/g,"");
  if(!val){S.fb={ok:false,t:"Введите код."};render();return}
  if(val===ch.code){if(isBonus())S.bonusOk=true;else S.solved[i]=true;S.fb=null}
  else{S.fb={ok:false,t:"Замок не открылся. Проверьте ещё раз вместе."};S.input[i]=""}
  commit();
  if(val!==ch.code){const l=$("lock");if(l){l.classList.remove("shake");void l.offsetWidth;l.classList.add("shake")}}
}

  const placed=w=>m[w];

   <div class="boxes" style="margin-top:12px">${ch.boxes.map((b,bi)=>{const ws=ch.words.filter(w=>placed(w)===bi);
     return `<button class="box${S.sel?" ready":""}" data-b="${bi}"><span class="h">${b[0]}<small>${b[1]} · ${ws.length}</small></span><span class="in">${ws.map(w=>`<span class="word" data-back="${w}">${w}</span>`).join("")}</span></button>`}).join("")}</div>
   <p class="hint" style="margin-top:10px;font-size:14px">Ошиблись? Нажмите на слово в коробке — оно вернётся обратно.</p>`;

  const mark=v=>v===1?"✓":v===2?"✗":"";
  p.innerHTML=`<div class="menu">${ch.gifts.map((g,k)=>`<div class="item"><span class="em">${g[0]}</span><span class="kr">${g[1]}</span><span class="num">№ ${k+1}</span></div>`).join("")}</div>
   <ol class="clues">${ch.clues.map(c=>`<li class="kr">${c}</li>`).join("")}</ol>
   <div class="lg-wrap"><table class="lg"><thead><tr><th></th>${ch.gifts.map((g,k)=>`<th>${g[0]}<br>${k+1}</th>`).join("")}</tr></thead>
   <tbody>${ch.friends.map((f,r)=>`<tr><th class="kr">${f}</th>${ch.gifts.map((g,k)=>{const v=m[r+"_"+k]||0;return `<td><button class="lc v${v}" data-k="${r}_${k}" aria-label="${f}, подарок ${k+1}">${mark(v)}</button></td>`}).join("")}</tr>`).join("")}</tbody></table></div>`;
  p.querySelectorAll(".lc").forEach(b=>b.onclick=()=>{const k=b.dataset.k;m[k]=((m[k]||0)+1)%3;if(!m[k])delete m[k];S.fb=null;commit()});
}

/* ---------- final ---------- */
function renderFinal(c){
  if(S.finalOk){
    const used=1200-timeLeft();
    c.innerHTML=`<div class="party"><div class="cake">🎂🎉</div><div class="place"><b>한강 공원</b>Финал</div>
      <div class="big">오늘은 정말 행복해요!</div><p class="story">«Сегодня я очень счастлива!» Суа нашлась: она ждала вас у реки с тортом. Вы прошли квест вместе${S.timer.left<1200||S.timer.running?` за ${Math.floor(used/60)} мин ${used%60} с`:""}.</p>
      <p class="task">Бонус устно: скажите Суа три предложения о себе с прилагательными из словарика. Например: 저는 오늘 피곤해요.</p>${S.bonusOk?"":`<button class="btn" id="toBonus">★ Задание со звёздочкой</button>`}</div>`;
    if($("toBonus"))$("toBonus").onclick=()=>{S.ch="bonus";S.fb=null;commit()};
    return}
  const m=(S.m.final=S.m.final||{}),tray=m.tray||[];
  const syls=CH.map(c=>c.syl);
  c.innerHTML=`<div><div class="place"><b>한강 공원</b>Финал · Пикник у реки</div><h2>Скажите пароль</h2></div>
    <p class="story">Вы на берегу реки Хан. Вдалеке видны шарики и торт… Но путь перекрывает друг Суа: «Сначала пароль!»</p>
    <p class="task">Соберите из слогов фразу из трёх слов. Подсказка: это то, что Суа чувствует сегодня.</p>
    <div class="tray">${tray.map(k=>`<span class="tile">${syls[k]}</span>`).join("")}</div>
    <div class="tiles">${syls.map((s,k)=>`<button class="tile${tray.includes(k)?" used":""}" data-k="${k}">${s}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost sm" id="clr">Стереть</button><button class="btn" id="check">Сказать пароль</button></div>
    <div class="feedback ${S.fb?(S.fb.ok?"ok":"no"):""}">${S.fb?esc(S.fb.t):""}</div>`;
  c.querySelectorAll(".tiles .tile").forEach(b=>b.onclick=()=>{m.tray=tray.concat(+b.dataset.k);S.fb=null;commit()});
  $("clr").onclick=()=>{m.tray=[];S.fb=null;commit()};
  $("check").onclick=()=>{
    const phrase=tray.map(k=>syls[k]).join("");
    if(phrase===FINAL_ORDER.join("")){S.finalOk=true;S.fb=null;if(S.timer.running){S.timer.left=timeLeft();S.timer.running=false}}
    else{S.fb={ok:false,t:tray.length<syls.length?"Используйте все слоги.":"Не то… Подумайте: «Сегодня — очень — счастлива»."};m.tray=[]}
    commit()};
}

/* ---------- timer & controls ---------- */
function timeLeft(){const t=S.timer;return t.running?Math.max(0,Math.round((t.endsAt-Date.now())/1000)):t.left}
function fmt(t){return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
$("timerBtn").onclick=()=>{const t=S.timer;if(t.running){t.left=timeLeft();t.running=false}else{if(t.left<=0)return;t.endsAt=Date.now()+t.left*1000;t.running=true}commit()};
setInterval(()=>{const l=timeLeft();$("time").textContent=fmt(l);$("time").classList.toggle("low",l<=120)},500);
let armSkip=false,armReset=false;
$("skip").onclick=()=>{
  if(isBonus()||S.ch>=CH.length)return;
  if(!armSkip){armSkip=true;$("skip").textContent="Точно пропустить?";setTimeout(()=>{armSkip=false;$("skip").textContent="Пропустить главу"},3000);return}
  armSkip=false;$("skip").textContent="Пропустить главу";S.solved[S.ch]=true;S.fb=null;commit()};
$("reset").onclick=()=>{
  if(!armReset){armReset=true;$("reset").textContent="Точно? Нажмите ещё раз";setTimeout(()=>{armReset=false;$("reset").textContent="Начать заново"},3000);return}
  armReset=false;$("reset").textContent="Начать заново";S=fresh();commit()};
$("dgrid").innerHTML=DICT.map(([g,ws])=>`<div><h3>${g}</h3><dl>${ws.map(([k,r])=>`<dt>${k}</dt><dd>${r}</dd>`).join("")}</dl></div>`).join("");
render();
</script>

</body></html>
