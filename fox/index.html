<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Покорми лисичку 🦊</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    background: linear-gradient(#fff7e8, #ffe7c7);
    color: #4a2a10; overflow: hidden; touch-action: manipulation;
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; padding: 16px; }
  .screen.on { display: flex; }

  /* MENU */
  #menu { justify-content: center; gap: 18px; }
  #menu h1 { margin: 0; font-size: clamp(28px, 6vw, 48px); text-align: center; }
  .bigfox { font-size: clamp(90px, 22vw, 170px); line-height: 1; animation: bob 2s ease-in-out infinite; }
  .modes { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; width: 100%; max-width: 900px; }
  .mode {
    flex: 1 1 240px; max-width: 300px; border: none; border-radius: 28px; padding: 18px 12px;
    background: #fff; box-shadow: 0 6px 0 #e8b27a; font-size: 18px; color: #4a2a10; cursor: pointer;
  }
  .mode:active { transform: translateY(4px); box-shadow: 0 2px 0 #e8b27a; }
  .mode .em { display: block; font-size: 56px; line-height: 1.1; }
  .mode .ko { display: block; font-size: 30px; font-weight: 800; margin: 4px 0; }
  .note { font-size: 14px; opacity: .75; text-align: center; max-width: 620px; }

  /* GAME */
  #game { justify-content: space-between; }
  .top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  .iconbtn { border: none; background: #fff; border-radius: 50%; width: 56px; height: 56px; font-size: 28px; box-shadow: 0 4px 0 #e8b27a; cursor: pointer; }
  .stars { font-size: 26px; letter-spacing: 2px; min-height: 34px; text-align: center; flex: 1; }
  .foxzone { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .fox { font-size: clamp(110px, 26vw, 200px); line-height: 1; transition: transform .2s; cursor: pointer; }
  .fox.eat { animation: chomp .5s ease 2; }
  .fox.no { animation: shake .45s ease; }
  .bubble {
    background: #fff; border-radius: 30px; padding: 14px 22px; position: relative;
    font-size: clamp(36px, 8vw, 64px); font-weight: 800; min-width: 140px; text-align: center;
    box-shadow: 0 4px 0 #e8b27a; cursor: pointer;
  }
  .bubble::before { content: ""; position: absolute; left: -16px; top: 50%; margin-top: -12px;
    border: 12px solid transparent; border-right: 18px solid #fff; border-left: 0; }
  .bubble small { display: block; font-size: 16px; font-weight: 400; opacity: .6; }
  .choices { display: flex; gap: clamp(10px, 3vw, 28px); justify-content: center; width: 100%; flex-wrap: wrap; margin-bottom: 10px; }
  .item {
    border: none; background: #fff; border-radius: 30px; cursor: pointer;
    width: clamp(130px, 28vw, 230px); height: clamp(150px, 32vw, 260px);
    box-shadow: 0 7px 0 #e8b27a; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #4a2a10; transition: transform .15s, opacity .3s;
  }
  .item:active { transform: translateY(4px); box-shadow: 0 3px 0 #e8b27a; }
  .item .em { font-size: clamp(64px, 14vw, 120px); line-height: 1.05; }
  .item .w { font-size: clamp(22px, 5vw, 36px); font-weight: 800; margin-top: 6px; }
  .item.syl .em { font-size: clamp(80px, 18vw, 150px); font-weight: 900; color: #c4531a; }
  .item.wrong { animation: shake .45s ease; opacity: .45; }
  .item.fly { animation: fly .6s ease forwards; }
  .hidewords .item .w { visibility: hidden; }

  /* WIN */
  #win { justify-content: center; gap: 16px; text-align: center; }
  #win .bigfox { font-size: 150px; }
  #win h2 { font-size: 56px; margin: 0; }
  .again { border: none; background: #ff9a3c; color: #fff; font-size: 30px; font-weight: 800; padding: 16px 40px; border-radius: 40px; box-shadow: 0 6px 0 #c4531a; cursor: pointer; }
  .confetti { position: fixed; top: -60px; font-size: 40px; animation: fall linear forwards; pointer-events: none; }

  @keyframes bob { 50% { transform: translateY(-10px); } }
  @keyframes chomp { 30% { transform: scale(1.25) rotate(-6deg); } 60% { transform: scale(.95) rotate(4deg); } }
  @keyframes shake { 20%,60% { transform: translateX(-12px); } 40%,80% { transform: translateX(12px); } }
  @keyframes fly { to { transform: translateY(-45vh) scale(.2); opacity: 0; } }
  @keyframes fall { to { transform: translateY(115vh) rotate(360deg); } }
</style>
</head>
<body>

<div id="menu" class="screen on">
  <div class="bigfox">🦊</div>
  <h1>Покорми лисичку!<br><span style="font-size:.7em">여우야, 배고파?</span></h1>
  <div class="modes">
    <button class="mode" data-mode="known"><span class="em">🍎🥛🥒</span><span class="ko">사과 · 우유</span>Знакомая еда</button>
    <button class="mode" data-mode="loan"><span class="em">🍕🍌🍦</span><span class="ko">피자 · 바나나</span>Как по-русски!</button>
    <button class="mode" data-mode="syl"><span class="em">🦊</span><span class="ko">아 오 우 이</span>Буквы</button>
  </div>
  <label class="note"><input type="checkbox" id="showWords" checked> показывать корейские слова под картинками</label>
  <div class="note" id="voiceNote"></div>
</div>

<div id="game" class="screen">
  <div class="top">
    <button class="iconbtn" id="home" aria-label="Меню">🏠</button>
    <div class="stars" id="stars"></div>
    <button class="iconbtn" id="again" aria-label="Повторить">🔊</button>
  </div>
  <div class="foxzone">
    <div class="fox" id="fox">🦊</div>
    <div class="bubble" id="bubble"></div>
  </div>
  <div class="choices" id="choices"></div>
</div>

<div id="win" class="screen">
  <div class="bigfox">🦊</div>
  <h2>잘했어!</h2>
  <div style="font-size:24px">Лисичка сытая! Молодец!</div>
  <button class="again" id="playAgain">또! 🔁</button>
  <button class="mode" id="toMenu" style="max-width:220px;flex:none">🏠 меню</button>
</div>

    { ko: "우유", id: "uyu", em: "🥛" }, { ko: "사과", id: "sagwa", em: "🍎" }, { ko: "토마토", id: "tomato", em: "🍅" },
    { ko: "체리", id: "cheri", em: "🍒" }, { ko: "오이", id: "oi", em: "🥒" }
  ],
  loan: [
    { ko: "바나나", id: "banana", em: "🍌" }, { ko: "피자", id: "pija", em: "🍕" }, { ko: "키위", id: "kiwi", em: "🥝" },
    { ko: "레몬", id: "lemon", em: "🍋" }, { ko: "멜론", id: "mellon", em: "🍈" }, { ko: "망고", id: "manggo", em: "🥭" },
    { ko: "주스", id: "juseu", em: "🧃" }, { ko: "초콜릿", id: "chokollit", em: "🍫" }, { ko: "케이크", id: "keikeu", em: "🎂" },
    { ko: "아이스크림", id: "aiseukeurim", em: "🍦" }, { ko: "토마토", id: "tomato", em: "🍅" }, { ko: "체리", id: "cheri", em: "🍒" }
  ],
  syl: [
    { ko: "아", id: "a", em: "아", syl: true }, { ko: "오", id: "o", em: "오", syl: true },
    { ko: "우", id: "u", em: "우", syl: true }, { ko: "이", id: "i", em: "이", syl: true }
  ]
};
const GOAL = 8;

let mode = "known", target = null, stars = 0, busy = false, lastKo = null, koVoice = null;

/* ---------- speech ---------- */
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    koVoice = vs.find(v => /^ko/i.test(v.lang)) || null;
    document.getElementById("voiceNote").textContent = "🔊 Включите звук на планшете — лисичка говорит по-корейски.";
  } catch (e) {}
}
try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
pickVoice();

const player = new Audio();
let queue = [];
function playIds(list) {
  queue = list.slice();
  playNext();
}
function playNext() {
  const id = queue.shift();
  if (!id || !AUDIO[id]) return;
  try {
    player.pause();
    player.src = AUDIO[id];
    player.onended = playNext;
    const p = player.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function say(text, rate = 0.8) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; u.rate = rate; u.pitch = 1.25;
    if (koVoice) u.voice = koVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function renderStars() { $("stars").textContent = "⭐".repeat(stars) + "☆".repeat(GOAL - stars); }

/* ---------- game ---------- */
function start(m) {
  mode = m; stars = 0; lastKo = null;
  document.body.classList.toggle("hidewords", !$("showWords").checked);
  renderStars(); show("game"); nextRound();
}

function nextRound() {
  busy = false;
  const set = SETS[mode];
  let pool = set.filter(x => x.ko !== lastKo);
  target = pool[Math.floor(Math.random() * pool.length)];
  lastKo = target.ko;
  const n = mode === "syl" ? 4 : 3;
  const others = shuffle(set.filter(x => x.ko !== target.ko)).slice(0, n - 1);
  const opts = shuffle([target, ...others]);

  $("bubble").innerHTML = target.ko + "<small>주세요!</small>";
  const box = $("choices"); box.innerHTML = "";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "item" + (o.syl ? " syl" : "");
    b.innerHTML = `<span class="em">${o.em}</span>` + (o.syl ? "" : `<span class="w">${o.ko}</span>`);
    b.onclick = () => pick(o, b);
    box.appendChild(b);
  });
  setTimeout(() => playIds([target.id]), 250);
}

function pick(o, el) {
  if (busy) return;
  if (o.ko === target.ko) {
    busy = true;
    el.classList.add("fly");
    const fox = $("fox"); fox.classList.remove("eat"); void fox.offsetWidth; fox.classList.add("eat");
    $("bubble").innerHTML = "냠냠!<small>맛있어!</small>";
    playIds(["nyam"]);
    stars++; renderStars();
    setTimeout(() => { stars >= GOAL ? win() : nextRound(); }, 1700);
  } else {
    el.classList.remove("wrong"); void el.offsetWidth; el.classList.add("wrong");
    const fox = $("fox"); fox.classList.remove("no"); void fox.offsetWidth; fox.classList.add("no");
    playIds(["aniya", target.id]);
  }
}

function win() {
  show("win"); playIds(["jalhaesseo"]);
  const em = ["⭐", "🍎", "🍌", "🦊", "🍒", "🎉", "🥒"];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("div");
    s.className = "confetti"; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 2 + Math.random() * 2 + "s";
    s.style.animationDelay = Math.random() * 1 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5000);
  }
}

document.querySelectorAll(".mode[data-mode]").forEach(b => b.onclick = () => { playIds(["annyeong"]); setTimeout(() => start(b.dataset.mode), 900); });
$("again").onclick = $("bubble").onclick = () => target && playIds([target.id]);
$("fox").onclick = () => playIds([target ? target.id : "annyeong"]);
$("home").onclick = () => { try { player.pause(); } catch (e) {} show("menu"); };
$("playAgain").onclick = () => start(mode);
$("toMenu").onclick = () => show("menu");
</script>
</body>
</html>
